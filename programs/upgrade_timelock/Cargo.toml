[package]
name = "upgrade_timelock"
version = "0.1.0"
description = "The upgrade owner on Solana: a timelock that holds every program's upgrade authority; its delay starts at 10 minutes and only grows, up to 30 days"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "upgrade_timelock"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.0" }
solana-sha256-hasher = { version = "3", features = ["sha2"] }
