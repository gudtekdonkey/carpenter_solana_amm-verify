[package]
name = "carpenter_amm"
version = "0.1.0"
description = "FLOOR on Solana: the v4-shaped AMM with approved hooks"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "carpenter_amm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.0", features = ["event-cpi"] }
anchor-spl = { version = "=1.2.0", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
carpenter-types = { path = "../../crates/carpenter-types" }
carpenter-clmm-math = { path = "../../crates/carpenter-clmm-math" }
solana-sha256-hasher = { version = "3", features = ["sha2"] }
carpenter-mint-gate = { path = "../../crates/carpenter-mint-gate" }
