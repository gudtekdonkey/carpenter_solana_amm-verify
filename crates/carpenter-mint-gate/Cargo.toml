[package]
name = "carpenter-mint-gate"
version = "0.1.0"
edition = "2021"
description = "Carpenter on Solana: the ONE capability gate over a mint (D-19 as a ROLE-aware capability judgement, fused with the Q-11 Pausable axis). Pure: bytes in, a caps bitmap or a named refusal out."
license = "UNLICENSED"
publish = false

[lib]
doctest = false

[dependencies]
spl-token-2022-interface = "2.1.0"
solana-pubkey = "3.0.0"
solana-sha256-hasher = "3.1.0"

[dev-dependencies]
serde_json = "1"
hex = "0.4"
carpenter-types = { path = "../carpenter-types" }
solana-program-pack = "3"
