[workspace]
members = ["programs/*", "crates/*", "tests/programs/mock_hook"]
exclude = ["tests", "trident-tests", "wasm", ".scratch", "crates/carpenter-amm"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[profile.release.package.floor_launch]
opt-level = "z"
[profile.release.package.floor_holders]
opt-level = "z"
[profile.release.package.floor_vesting]
opt-level = "z"
