[package]
name = "mock_hook"
version = "0.1.0"
description = "TEST-ONLY pass-through approved hook for carpenter_amm. Never deployed."
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=1.2.0"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
carpenter-types = { path = "../../../crates/carpenter-types" }
